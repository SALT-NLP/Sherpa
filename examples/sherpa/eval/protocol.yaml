# Frozen evaluation protocol: the paper's main evaluation (528 questions x seven
# student preferences, 27B judge, draft-unverified pre-solve, 2048-token teacher
# turns, eight re-tests). A complete config of its own that never inherits
# training defaults. Endpoints and keys come from environment variables set by
# the runners; the served model names are fixed here.
experiment_name: sherpa-evaluation
trial_name: checkpoint-evaluation
seed: 42
tokenizer_path: ${actor.path}
workflow: examples.sherpa.workflow.SherpaWorkflow
eval_workflow: ${workflow}
max_turns: 10
enable_thinking: false
teacher_response_format: non_thinking
guidance_gate: true
adaptive_gate: true
adaptive_gate_prompts_path: examples/sherpa/prompt_pools/preference_prompts.json
adaptive_gate_complaints_path: examples/sherpa/prompt_pools/preference_complaints.json
adaptive_gate_retries: 3
retest_replays: 8
teacher_pre:
  enabled: true
  verify: true
  attempts: 3
  max_tokens: 4096
length_retry:
  enabled: false
  attempts: 3
auxiliary_model:
  mode: api
  enable_thinking: false
  base_url: ${oc.env:EVAL_AUX_URL}
  model: qwen3.8-27b-fp8
  api_key: ${oc.env:EVAL_AUX_KEY}
  timeout: 120
  max_tokens: 1024
  temperature: 0.0
  top_p: 1.0
  max_concurrent_calls: 192
  request_params:
    seed: 42
    extra_body:
      top_k: 20
      min_p: 0
      chat_template_kwargs:
        enable_thinking: false
  answer_judge_enabled: true
  answer_judge_max_tokens: 256
student_models:
- name: none
  preference: none
  base_url: ${oc.env:EVAL_STUDENT_URL}
  model: qwen3-1.7b
  api_key: ${oc.env:EVAL_STUDENT_KEY}
  weight: 1.0
  timeout: 120
  max_tokens: 2048
  temperature: 0.7
  top_p: 0.8
  max_concurrent_calls: 192
  request_params:
    extra_body:
      top_k: 20
      min_p: 0
      chat_template_kwargs:
        enable_thinking: false
- name: attempt-diagnosis
  preference: attempt-diagnosis
  base_url: ${oc.env:EVAL_STUDENT_URL}
  model: qwen3-1.7b
  api_key: ${oc.env:EVAL_STUDENT_KEY}
  weight: 1.0
  timeout: 120
  max_tokens: 2048
  temperature: 0.7
  top_p: 0.8
  max_concurrent_calls: 192
  request_params:
