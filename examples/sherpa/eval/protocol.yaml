reward:
  guidance_gate_fail_penalty: 0.0
  format_error_penalty: -0.5
  teacher_exact_repeat_penalty: -0.5
  adaptive_gate_fail_penalty: 0.0
debug_trace_dir: ''
cluster:
  fileroot: output/sherpa
gconfig:
  n_samples: 8
  min_new_tokens: 0
  max_new_tokens: 2048
  max_tokens: 24576
  greedy: false
  temperature: 1.0
  top_p: 1.0
  lora_name: default_lora
eval_gconfig:
  n_samples: 1
  min_new_tokens: 0
  max_new_tokens: 2048
  max_tokens: 24576
  greedy: false
  temperature: ${gconfig.temperature}
  top_p: 1.0
  lora_name: default_lora
actor:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${oc.env:SHERPA_TOKENIZER,Qwen/Qwen3-8B}
  advantage_estimator: rebn
  # Required by the config schema; the standalone evaluator starts no engine.
  backend: fsdp:d1p1t1
rollout:
  backend: sglang:d1p1t1
sglang:
  context_length: 40960
train_dataset:
  batch_size: 16
  path: ${oc.env:SHERPA_DATASET,examples/sherpa/data/math_1.7b_8b/math_filtered}
  type: rl
valid_dataset:
  batch_size: 16
  path: ${oc.env:SHERPA_DATASET,examples/sherpa/data/math_1.7b_8b/math_filtered}
  type: rl
saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
recover:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  teacher_pre_enabled: true
  teacher_pre_verify: false
  average_rollouts: 1
  student_model_names: null
