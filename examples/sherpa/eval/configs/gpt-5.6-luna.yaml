# GPT-5.6 Luna through the OpenAI API, with the same settings as
# gemini-3.8-flash.
extends: base.yaml
run_name: gpt-5.6-luna-medium
teacher:
  model: gpt-5.6-luna
  endpoint_env: OPENAI_BASE_URL
  key_env: OPENAI_API_KEY
  checkpoint: gpt-5.6-luna
  adapter_env: null
  tokenizer: Qwen/Qwen3-8B
  format: thinking
  enable_thinking: false
  request_params: {}
  provider:
    name: openai
    reasoning_effort: medium
    sampling: provider-default
    output_limit: provider-default
execution:
  concurrency: 16
  student_concurrency: 192
  judge_concurrency: 192
  episode_timeout_seconds: 1800
  episode_error_retries: 1
