  weight_update_mode: disk
  optimizer:
    type: adam
    lr: 1.5e-5
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-8
    lr_scheduler_type: constant
    # Warm up over one epoch (0.001 x total_train_epochs 1000).
    warmup_steps_proportion: 0.001
    gradient_clipping: 1.0
  temperature: ${gconfig.temperature}
  max_new_tokens: ${gconfig.max_new_tokens}
  # ReBN advantages; actor.group_baseline is derived from mask_rejected_turns.
  advantage_estimator: rebn
  group_baseline_leave1out: true
  adv_norm:
    mean_level: null
    std_level: batch
  ppo_n_minibatches: 2
  eps_clip: 0.2
  c_clip: 3.0
  kl_ctl: 0.0
  recompute_logprob: true
  use_decoupled_loss: true
  scheduling_spec:
  - task_type: worker
    port_count: 2
    gpu: 1
    cmd: python3 -m areal.infra.rpc.rpc_server
    env_vars: {}

